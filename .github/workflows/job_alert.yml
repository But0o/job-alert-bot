name: Job Alert Bot

on:
  schedule:
    # Cada 5 minutos, arrancando en el minuto 7 (no en el 0) para evitar
    # la hora pico de crons de todo GitHub, que suelen saltear los "*/5" justos.
    - cron: "7-59/5 * * * *"
  workflow_dispatch: {}  # para correrlo manualmente desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python bot.py

      - name: Guardar el estado (keywords, ofertas vistas, comandos procesados)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add state.json seen_jobs.json seen_emails.json || true
          git diff --staged --quiet || git commit -m "Actualizar estado del bot"

          if ! git push; then
            echo "::error::El push del estado falló, avisando por Telegram"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ El bot no pudo guardar su estado en GitHub (git push falló). Puede volver a repetir mensajes viejos hasta que se resuelva. Revisá los permisos de Actions (Settings → Actions → General → Workflow permissions) o los logs de esta corrida." \
              > /dev/null
            exit 1
          fi