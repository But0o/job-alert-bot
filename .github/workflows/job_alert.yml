name: Job Alert Bot

on:
  schedule:
    # Corre cada 15 minutos. GitHub no garantiza el minuto exacto, puede
    # atrasarse unos minutos más en horas pico.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # para correrlo manualmente desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python bot.py

      - name: Guardar el estado (keywords, ofertas vistas, comandos procesados)
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add state.json seen_jobs.json seen_emails.json || true
          git diff --staged --quiet || git commit -m "Actualizar estado del bot"
          git push || true
