name: Job Alert Bot

on:
  schedule:
    # Corre todos los días 12:00 y 21:00 UTC (9am y 6pm hora Argentina)
    - cron: "0 12,21 * * *"
  workflow_dispatch: {}  # también podés correrlo manualmente desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert_bot.py

      - name: Guardar el estado de ofertas ya vistas
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json || true
          git diff --staged --quiet || git commit -m "update seen_jobs.json"
          git push || true
